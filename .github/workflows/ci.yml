# CI for the campaign engine and its DCS-side Lua client.
#
# This repository is private, so every minute here is billed against a monthly
# allowance, and Windows minutes count double. Hence: one Python version, pip
# cached, superseded runs cancelled, hard timeouts, no schedule, documentation-
# only changes skipped, and both test configurations run inside one job per OS
# rather than one job each (every job pays for its own runner start-up, and
# billing rounds each job up to a whole minute).
#
# Nothing here publishes anything. The exe is uploaded as this run's own
# artifact and expires; releasing it is the owner's decision.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch (or PR) makes an in-flight run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The e2e tests drive real sockets; a hang must not burn the default six
    # hours (twelve, billed, on Windows).
    timeout-minutes: 15
    strategy:
      matrix:
        # Windows is the owner's platform and DCS's. Linux is cheaper and the
        # engine is cross-platform; lupa ships cp314 manylinux wheels.
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Order matters: this must run before requirements-dev.txt is installed.
      # The guard fails if lupa is importable here, if anything skips for a
      # reason other than missing lupa, or if nothing skipped at all.
      - name: Tests, standard library only (Lua tests must skip)
        run: python tools/ci_tests.py --lua absent

      - name: Install development dependencies (lupa)
        run: python -m pip install -r requirements-dev.txt

      # The guard executes Lua 5.1 through lupa before any test runs, and fails
      # the job if a single test skips. Without it, a lupa that failed to
      # install would leave the Lua client untested under a green tick.
      - name: Tests, with lupa (nothing may skip)
        run: python tools/ci_tests.py --lua required

  exe:
    name: windows exe
    # A broken engine is never packaged.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Build dist/dcs-campaign-engine.exe
        run: python tools/build_exe.py

      # The smoke tests run from outside the checkout, so an exe that only
      # works because the source tree happens to sit next to it fails here.
      - name: Smoke test, --help
        working-directory: ${{ runner.temp }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\dcs-campaign-engine.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "build did not produce $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      - name: Smoke test, --simulate 600 writes a save
        working-directory: ${{ runner.temp }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\dcs-campaign-engine.exe'
          $save = Join-Path $env:RUNNER_TEMP 'smoke-campaign.json'
          if (Test-Path -LiteralPath $save) { Remove-Item -LiteralPath $save }
          & $exe --save $save --simulate 600
          if ($LASTEXITCODE -ne 0) { throw "--simulate 600 exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $save -PathType Leaf)) { throw "no save written at $save" }
          # The save must be a campaign whose clock actually advanced 600 s.
          python -c "import json, sys; clock = json.load(open(sys.argv[1], encoding='utf-8'))['clock']; print('save clock:', clock); sys.exit(0 if clock == 600 else 'save clock is %r, expected 600' % clock)" $save
          if ($LASTEXITCODE -ne 0) { throw "save check failed" }

      # Artifact storage on a private repository is metered too; a week is
      # long enough to fetch a build and short enough not to pile up.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dcs-campaign-engine-exe-${{ github.sha }}
          path: dist/dcs-campaign-engine.exe
          if-no-files-found: error
          retention-days: 7
